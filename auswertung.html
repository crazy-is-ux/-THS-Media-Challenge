<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THS · Quiz-Auswertung</title><style>
*{box-sizing:border-box}body{margin:0;background:#080e20;color:#f3f7ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.dashboard{max-width:2400px;margin:auto;padding:20px 26px;min-height:100dvh;display:flex;flex-direction:column;gap:15px}header{display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{color:#6de2d1;font-size:12px;font-weight:850;letter-spacing:2px}h1{font-size:clamp(24px,2.6vw,50px);line-height:1.1;margin:6px 0}h1 span{color:#96a8ff}.subtitle{margin:5px 0 0;color:#b4c2dc;font-size:13px}.total{display:flex;align-items:center;gap:16px;background:#14243e;border:1px solid #34506c;border-radius:18px;padding:9px 24px;flex-shrink:0}.total strong{font-size:clamp(38px,4vw,72px);line-height:1;color:#75edda;font-variant-numeric:tabular-nums}.total span{font-size:14px;font-weight:750;max-width:105px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;flex:1}.card{background:linear-gradient(140deg,#14243d,#101a30);border:1px solid #2e4263;border-radius:18px;padding:16px 19px;min-width:0;display:flex;flex-direction:column}.card h2{font-size:clamp(17px,1.35vw,26px);margin:0 0 3px;line-height:1.2}.hint{font-size:11px;line-height:1.3;color:#afbdd5;min-height:27px;margin:0 0 7px}.rows{display:flex;flex-direction:column;justify-content:space-evenly;gap:8px;flex:1}.row{min-width:0}.row-head{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-bottom:4px}.label{font-size:clamp(12px,1.03vw,20px);line-height:1.16;overflow-wrap:anywhere}.value{white-space:nowrap;font-size:clamp(14px,1.2vw,24px);font-variant-numeric:tabular-nums;font-weight:850}.value small{font-size:.72em;color:#bbc8e0;font-weight:600}.track{height:clamp(7px,1vh,13px);border-radius:20px;background:#263751;overflow:hidden}.fill{height:100%;border-radius:20px;background:linear-gradient(90deg,#52dfcf,#7b91ff);transition:width .5s}.card:nth-child(2n) .fill{background:linear-gradient(90deg,#8892ff,#bd90fc)}footer{display:flex;align-items:center;justify-content:space-between;gap:12px;color:#bdcae0;font-size:12px}.status{display:flex;gap:8px;align-items:center}.dot{height:8px;width:8px;background:#74e7c6;border-radius:50%;flex-shrink:0}.error .dot{background:#ffba72}.actions{display:flex;gap:8px;align-items:center}button,a{font:inherit;color:#e5edff;background:#182b47;border:1px solid #3c5577;border-radius:8px;padding:7px 11px;text-decoration:none;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #75edda}button:disabled{opacity:.6}.empty{color:#aebfd9} 
@media(min-width:1000px) and (min-height:600px){.dashboard{height:100dvh;min-height:0}.grid{min-height:0;grid-template-rows:repeat(2,minmax(0,1fr))}.card{min-height:0}}
@media(min-width:1600px){.dashboard{padding:25px 34px;gap:20px}.grid{gap:20px}.card{padding:22px 26px}.hint{font-size:14px}.brand,footer,.subtitle{font-size:15px}}
@media(max-width:999px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card{min-height:260px}.dashboard{padding:16px;gap:12px}.total{padding:12px}.total span{font-size:12px}footer{flex-wrap:wrap}}
@media(max-width:560px){header{align-items:flex-start;gap:10px}.grid{grid-template-columns:1fr}.total{flex-direction:column;gap:3px;text-align:center}.total strong{font-size:35px}.total span{font-size:10px}.brand{font-size:10px}.subtitle{font-size:12px}h1{font-size:25px}.card{min-height:280px}.label{font-size:15px}.value{font-size:20px}.hint{font-size:12px}}
@media(min-width:1000px) and (max-height:800px){.dashboard{padding:12px 18px;gap:10px}.grid{gap:10px}.card{padding:10px 14px}.card h2{font-size:17px}.hint{font-size:10px;min-height:18px;margin-bottom:4px}.rows{gap:4px}.label{font-size:12px}.value{font-size:15px}.track{height:6px}.total strong{font-size:42px}h1{font-size:28px}.subtitle{font-size:12px}}
@media(min-width:700px) and (max-width:999px) and (min-height:850px){.dashboard{height:100dvh;min-height:0}.grid{min-height:0;grid-template-rows:repeat(3,minmax(0,1fr))}.card{min-height:0;padding:10px 14px}.hint{min-height:18px;margin-bottom:4px}.rows{gap:4px}.track{height:6px}.card h2{font-size:17px}}

.metrics{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:12px 0}.big{font-size:clamp(28px,3vw,54px);font-weight:900;color:#75edda}.wrong{color:#ff9eac}.legend{font-size:13px;color:#c5d4eb}.track{height:16px;display:flex}.fill{background:#62dccc!important}.miss{height:100%;background:#fb8095}.card{justify-content:space-between}.switch{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.card p{color:#b9c9df}.qr{width:110px;height:110px;background:white;padding:5px}.join{display:flex;align-items:center;justify-content:space-between;gap:10px}
@media(min-width:1000px){.seven .grid{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}}
@media(min-width:700px) and (max-width:999px) and (min-height:850px){.seven .dashboard{height:auto;min-height:100dvh}.seven .grid{grid-template-rows:none}.seven .card{min-height:220px}}
</style></head><body><main class="dashboard"><header><div><div class="brand">THS · MEDIA CHALLENGE · LIVE</div><h1 id="title">Quiz-Auswertung</h1><div class="switch"><a href="?quiz=bilder">Echt oder KI?</a><a href="./social-media-auswertung.html">Umfrage-Auswertung</a></div></div><div class="total"><strong id="count">–</strong><span>abgeschlossene Teilnahmen</span></div></header><div class="grid" id="charts"></div><footer><span id="status" role="status">Lade Ergebnisse …</span><div class="actions"><button id="reload">↻ Aktualisieren</button><button id="fullscreen">⛶ Vollbild</button></div></footer></main><script src="./stats.js"></script><script>
const quiz="bilder";
const names={bilder:["Bergsee: echtes Foto","Fuchs: echtes Foto","Essen: KI-generiertes Bild","Virales Video prüfen","KI-Detektor einordnen","TikToker: Glaubwürdigkeit prüfen","Unseriöse Webseiten erkennen"]};
document.body.classList.toggle("seven",quiz==="bilder");
document.getElementById("title").textContent="Echt oder KI? · Ergebnisse";
function render(rows,loaded){const data=rows.filter(x=>x.quiz===quiz);const root=document.getElementById("charts");root.replaceChildren();document.getElementById("count").textContent=loaded?(data[0]?.responses||0):"–";
names[quiz].forEach((name,i)=>{const r=data.find(x=>Number(x.question_id)===i+1);const total=Number(r?.responses)||0,bad=Number(r?.incorrect)||0,good=total-bad,pct=total?Math.round(good/total*100):0;const card=document.createElement("section");card.className="card";const h=document.createElement("h2");h.textContent=String(i+1).padStart(2,"0")+" · "+name;const metrics=document.createElement("div");metrics.className="metrics";metrics.innerHTML='<div><div class="big">'+(loaded?good:"–")+'</div><span class="legend">richtig</span></div><div><div class="big wrong">'+(loaded?bad:"–")+'</div><span class="legend">falsch</span></div>';const bar=document.createElement("div");bar.className="track";const yes=document.createElement("div");yes.className="fill";yes.style.width=pct+"%";const no=document.createElement("div");no.className="miss";no.style.width=(total?100-pct:0)+"%";bar.append(yes,no);const note=document.createElement("p");note.textContent=total?pct+" % richtig · "+total+" Antworten":loaded?"Noch keine Antworten":"Wird geladen …";card.append(h,metrics,bar,note);root.append(card)});
}
let busy=false;
async function load(){if(busy)return;busy=true;document.getElementById("reload").disabled=true;try{const rows=await window.THSStats.summary();if(!Array.isArray(rows))throw Error();render(rows,true);document.getElementById("status").textContent="Live · "+new Date().toLocaleTimeString("de-DE")+" · Aktualisiert alle 15 Sekunden"}catch{document.getElementById("status").textContent="Verbindung unterbrochen · Erneuter Versuch automatisch"}finally{busy=false;document.getElementById("reload").disabled=false}}
document.getElementById("reload").addEventListener("click",load);document.getElementById("fullscreen").addEventListener("click",async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{document.getElementById("status").textContent="Vollbild am Computer mit F11 einschalten."}});document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});render([],false);load();setInterval(()=>{if(!document.hidden)load()},15000);
</script></body></html>
