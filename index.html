<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080D1C"><title>THS Media Challenge</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#edf5ff;background:#080d1c}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 85% 15%,#32205a 0,transparent 40%),radial-gradient(circle at 10% 90%,#0a3c4a 0,transparent 35%),#080d1c}.wrap{max-width:950px;margin:auto;padding:24px 18px 60px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}header b{letter-spacing:.12em}.tag{color:#67f5dc;font-size:.75rem;letter-spacing:.14em;font-weight:800}main{margin:8vh auto 0}.card{border:1px solid #ffffff24;border-radius:26px;padding:clamp(22px,5vw,45px);background:#ffffff0c;box-shadow:0 24px 80px #0005;backdrop-filter:blur(18px)}h1{font-size:clamp(2.4rem,8vw,5rem);line-height:1.06;letter-spacing:-.05em;margin:20px 0}h2{font-size:clamp(1.5rem,4vw,2.5rem);line-height:1.2}p{color:#b9c9df;line-height:1.6}.pill{display:inline-flex;border:1px solid #ffffff30;border-radius:99px;padding:8px 13px;color:#b9c9df;font-size:.85rem}.topics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:25px 0}.topic{padding:18px;background:#ffffff0a;border:1px solid #ffffff22;border-radius:15px}.topic strong{display:block;margin-top:8px}button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:16px 20px;font-weight:800;color:#fff;background:#ffffff16;min-height:54px;transition:transform .15s,background .15s}button:hover{transform:translateY(-2px);background:#ffffff25}button:focus-visible{outline:3px solid #70f7eb;outline-offset:3px}.primary{background:linear-gradient(110deg,#2979ff,#7d4fff);box-shadow:0 8px 35px #376bff50}.primary:hover{background:linear-gradient(110deg,#458bff,#946cff)}.muted{background:transparent;border:1px solid #ffffff36}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:25px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}.answers button{text-align:left;border:1px solid #ffffff30}.answers button.correct{border-color:#52ebbf;background:#0d5d4d}.answers button.wrong{border-color:#ff768e;background:#713041}.answers button:disabled{cursor:default;opacity:.8;transform:none}.answers button.correct:disabled{opacity:1}.bar{height:9px;background:#ffffff20;border-radius:99px;overflow:hidden;margin:16px 0 24px}.bar>div{height:100%;background:linear-gradient(90deg,#3587ff,#65f5da);transition:width .3s}.feedback{padding:18px;border-radius:14px;background:#ffffff12;margin-top:18px;border:1px solid #ffffff2b}.score{font-size:clamp(4rem,16vw,8rem);font-weight:900;letter-spacing:-.07em;background:linear-gradient(90deg,#6c9fff,#7bf7df);color:transparent;background-clip:text}footer{color:#8494aa;font-size:.8rem;margin-top:25px}small{color:#a7bad3}.hide{display:none}@media(max-width:600px){.topics,.answers{grid-template-columns:1fr}main{margin-top:35px}.card{border-radius:20px}.actions button{width:100%}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><div class="wrap"><header><b>THS <span style="color:#6d9cff">/ MEDIA LAB</span></b><button class="muted" id="fullscreen" aria-label="Vollbild aktivieren">⛶ Vollbild</button></header><main id="app" aria-live="polite"></main><footer>THEODOR-HEUSS-SCHULE · TAG DER OFFENEN TÜR · Keine Anmeldung · Kein Tracking</footer></div><script>
"use strict";
const questions=[
{t:"image",q:"Ist dieses Bild echt oder KI-generiert?",image:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Mountain_lake_in_Alps.jpg?width=900",answer:0,origin:"Echte Fotografie: Mountain lake in Alps, Wikimedia Commons / Pxhere, CC0, 1200 × 800 Pixel.",explain:"Diese Landschaft wurde fotografiert. Die dokumentierte Herkunft ist wichtiger als einzelne optische Auffälligkeiten."},
{t:"image",q:"Ist dieses Bild echt oder KI-generiert?",image:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Wild_Red_Fox.jpg?width=900",answer:0,origin:"Echte Fotografie: Wild Red Fox, T.Voekler, Wikimedia Commons, CC0, 2720 × 2890 Pixel.",explain:"Ein echter Fuchs kann genauso perfekt aussehen wie ein KI-Bild. Achte auf nachvollziehbare Bildquellen."},
{t:"image",q:"Ist dieses Bild echt oder KI-generiert?",image:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Generative_AI_can_be_used_to_create_realistic_images_of_food_dishes.jpg?width=900",answer:1,origin:"KI-generiertes Food-Bild von Dennis Sylvester Hurd, Midjourney, Wikimedia Commons, CC0, 2048 × 1024 Pixel.",explain:"Das Food-Motiv wurde künstlich generiert. Auch fotorealistische Motive sind kein Beleg für eine echte Aufnahme."},
{q:"Ein virales Video zeigt angeblich eine aktuelle Demonstration. Was ist die beste Prüfung?",options:["Die Kommentare lesen und der Mehrheit vertrauen","Einzelbilder rückwärts suchen und Datum, Ort sowie Originalquelle vergleichen","Das Video weiterleiten und nachfragen","Auf die hohe Auflösung achten"],answer:1,explain:"Alte Aufnahmen werden oft mit neuer Behauptung verbreitet. Eine Rückwärtssuche und Kontextprüfung helfen, die Herkunft einzuordnen."},
{q:"Ein KI-Detektor meldet 98 % Wahrscheinlichkeit für ein KI-Bild. Was folgt daraus?",options:["Das Bild ist definitiv KI-generiert","Das Bild ist definitiv echt","Das Ergebnis ist ein Hinweis, aber kein sicherer Herkunftsnachweis","Die Prozentzahl beweist, dass das Bild bearbeitet wurde"],answer:2,explain:"KI-Detektoren können falsch liegen. Ein belastbarer Nachweis braucht nachvollziehbare Herkunft und zusätzliche Belege."},
{q:"Wie überprüfst du eine verdächtige Nachricht?",options:["Sofort weiterleiten","Nur die Überschrift lesen","Mehrere seriöse Quellen und Originalbelege prüfen","Viele Likes als Beweis ansehen"],answer:2,explain:"Vergleiche Quellen, Datum, Autor und Belege. Hohe Reichweite beweist nichts."},
{q:"Welches Beispielpasswort ist am sichersten?",options:["12345678","Passwort2026","THS12345","Wolke!Fahrrad7Mond#See"],answer:3,explain:"Lange, einzigartige Passphrasen sind stärker. Nutze für jedes Konto ein anderes Passwort und möglichst MFA."},
{q:"Warum zeigen soziale Netzwerke bestimmte Beiträge häufiger?",options:["Weil alle dieselben Beiträge sehen","Weil Algorithmen dein Verhalten und andere Signale auswerten","Weil nur echte Nachrichten empfohlen werden","Weil die Reihenfolge zufällig ist"],answer:1,explain:"Empfehlungssysteme berücksichtigen etwa Interaktionen, Wiedergabedauer und Interessen."},
{q:"Welche Informationen solltest du nicht öffentlich teilen?",options:["Dein Lieblingsessen","Allgemeine Hobbys","Passwörter, private Adresse und Ausweisdaten","Dein Lieblingsfilm"],answer:2,explain:"Schütze Zugangsdaten und persönliche Identifikationsdaten. Teile nur, was wirklich nötig ist."}
];
let index=0,points=0,locked=false,started=false;
const app=document.getElementById("app");
function start(){started=true;index=0;points=0;locked=false;render()}
function home(){started=false;index=0;points=0;locked=false;render()}
function render(){if(!started){app.innerHTML='<section class="card"><span class="tag">TAG DER OFFENEN TÜR · THS</span><h1>THS MEDIA<br><span style="color:#73a0ff">CHALLENGE</span></h1><p style="font-size:1.2rem">Kannst du Wahrheit und Täuschung unterscheiden?</p><div class="topics"><div class="topic">◈<strong>Echt oder KI?</strong></div><div class="topic">◎<strong>Fake News erkennen</strong></div><div class="topic">◇<strong>Sicher im Internet</strong></div></div><p>3 Bildfragen + 3 Wissensfragen · ca. 2–3 Minuten. Für die Bildfragen wird eine Internetverbindung benötigt.</p><div class="actions"><button class="primary" id="start">CHALLENGE STARTEN →</button></div></section>';document.getElementById("start").onclick=start;return}
if(index>=6){const level=points<=1?"Medien-Anfänger":points<=3?"Digital-Entdecker":points<=4?"Medien-Profi":"Medien-Experte";app.innerHTML='<section class="card"><span class="tag">CHALLENGE ABGESCHLOSSEN</span><div class="score">'+points+'/4</div><h2>'+level+'</h2><p>'+Math.round(points/6*100)+' % richtig. Du hast gelernt, wie du Nachrichten prüfst, sichere Passwörter wählst, Algorithmen verstehst und deine Daten schützt.</p><div class="actions"><button class="primary" id="again">Erneut spielen</button><button class="muted" id="home">Zur Startseite</button></div></section>';document.getElementById("again").onclick=start;document.getElementById("home").onclick=home;return}
const q=questions[index];locked=false;app.innerHTML='<section class="card"><div class="tag">WISSENSCHALLENGE · FRAGE '+(index+1)+' / 6</div><div class="bar"><div style="width:'+(index/6*100)+'%"></div></div><h2>'+q.q+'</h2><div class="answers">'+q.options.map((v,i)=>'<button data-a="'+i+'"><span style="color:#83abff">'+String.fromCharCode(65+i)+'.</span> '+v+'</button>').join('')+'</div><div id="feedback" class="hide"></div><div class="actions"><button id="next" class="primary hide">'+(index===5?"ERGEBNIS ANZEIGEN":"WEITER →")+'</button></div></section>';document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>choose(Number(b.dataset.a)))}
function choose(a){if(locked)return;locked=true;const q=questions[index];if(a===q.answer)points++;document.querySelectorAll("[data-a]").forEach(b=>{const v=Number(b.dataset.a);b.disabled=true;if(v===q.answer)b.classList.add("correct");else if(v===a)b.classList.add("wrong")});const f=document.getElementById("feedback");f.className="feedback";f.innerHTML='<strong>'+(a===q.answer?"✓ Richtig!":"✕ Nicht ganz.")+'</strong><p>'+q.explain+'</p>'+(q.origin?'<small>'+q.origin+'</small>':'');const n=document.getElementById("next");n.classList.remove("hide");n.onclick=()=>{index++;render()}}
document.getElementById("fullscreen").onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.().catch(()=>{})};render();
</script></body></html>
