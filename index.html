<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1328"><title>THS Media Challenge – Echt oder KI?</title><style>*{box-sizing:border-box}body{margin:0;font:16px system-ui,-apple-system,sans-serif;color:#eff6ff;background:radial-gradient(circle at top right,#243e70,#0b1328 55%);min-height:100dvh}.wrap{max-width:760px;margin:auto;padding:24px 16px 70px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}.tag{color:#6be4d4;font-size:12px;letter-spacing:1.5px;font-weight:800}.card{background:#162440;border:1px solid #385276;border-radius:22px;padding:clamp(20px,5vw,36px);margin-top:36px;box-shadow:0 16px 48px #0005}h1{font-size:clamp(34px,7vw,54px);line-height:1.1;margin:20px 0}h2{font-size:clamp(22px,5vw,30px)}p{color:#c5d4eb;line-height:1.55}.btn{display:block;width:100%;border:1px solid #5574a1;border-radius:14px;background:#223858;color:#fff;padding:17px 18px;margin:12px 0;text-align:left;font:700 16px system-ui;cursor:pointer}.btn.primary{background:#367ff5;border-color:#367ff5;text-align:center}.btn:disabled{opacity:.8;cursor:default}.btn.correct{border-color:#38d5a6;background:#145a52}.btn.wrong{border-color:#ff7d8e;background:#642d46}.hide{display:none!important}.image{display:block;width:100%;max-height:350px;object-fit:contain;border-radius:14px;margin:18px auto;background:#101a30}.feedback{background:#263d60;border-radius:12px;padding:15px;margin:18px 0}.progress{height:9px;background:#304665;border-radius:10px;overflow:hidden}.progress div{height:100%;background:#65d7cb}.score{font-size:70px;font-weight:900;color:#65d7cb}a{color:#92c9ff}footer{color:#9cb0ce;text-align:center;font-size:12px;margin-top:34px}.image-wrap{position:relative;margin:18px auto}.image-wrap .image{margin:0;max-height:none}.marker{position:absolute;display:none;width:30px;height:30px;transform:translate(-50%,-50%);border:2px solid white;border-radius:50%;background:#e63d68;color:white;font-weight:900;align-items:center;justify-content:center;box-shadow:0 2px 8px #000}.image-wrap.revealed .marker{display:flex}.feedback li{margin:12px 0;line-height:1.5}.feedback a{display:inline-block;margin-top:10px}.nav{display:flex;gap:14px;flex-wrap:wrap;font-size:14px}.image-link{display:block;margin:8px 0}.source-note{font-size:13px}</style></head><body><div class="wrap"><header><b>THS <span style="color:#69e5d4">MEDIA CHALLENGE</span></b><nav class="nav"><a href="./social-media-umfrage.html">Umfrage</a><a href="./webseiten-check.html">Webseiten-Check</a><a href="./auswertung.html?quiz=bilder">Auswertung</a></nav></header><main id="app"><section class="card"><span class="tag">TAG DER OFFENEN TÜR</span><h1>Echt oder <span style="color:#86b6ff">KI?</span></h1><p>Erkennst du KI-Bilder und prüfst Informationen richtig? 6 Fragen · etwa 3 Minuten.</p><button class="btn primary" id="start">QUIZ STARTEN →</button></section></main><footer>THEODOR-HEUSS-SCHULE · Medienbildung · Keine Anmeldung</footer></div><script src="./stats.js"></script><script>
"use strict";
const questions=[
{t:"image",q:"Ist dieses Bild echt oder KI-generiert?",image:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Mountain_lake_in_Alps.jpg?width=900",answer:0,origin:"Echte Fotografie: Mountain lake in Alps, Wikimedia Commons / Pxhere, CC0, 1200 × 800 Pixel.",explain:"Diese Landschaft wurde fotografiert. Die dokumentierte Herkunft ist wichtiger als einzelne optische Auffälligkeiten."},
{t:"image",q:"Ist dieses Bild echt oder KI-generiert?",image:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Wild_Red_Fox.jpg?width=900",answer:0,origin:"Echte Fotografie: Wild Red Fox, T.Voekler, Wikimedia Commons, CC0, 2720 × 2890 Pixel.",explain:"Ein echter Fuchs kann genauso perfekt aussehen wie ein KI-Bild. Achte auf nachvollziehbare Bildquellen."},
{t:"image",q:"Ist dieses Bild echt oder KI-generiert?",image:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Generative_AI_can_be_used_to_create_realistic_images_of_food_dishes.jpg?width=900",answer:1,origin:"KI-generiertes Food-Bild von Dennis Sylvester Hurd, Midjourney, Wikimedia Commons, CC0, 2048 × 1024 Pixel.",explain:"Dieses Bild wurde mit Midjourney erzeugt. Die nummerierten Stellen zeigen, wo ihr genauer prüfen könnt. Die sichtbaren Auffälligkeiten allein beweisen aber keine KI-Herkunft."},
{q:"Ein virales Video zeigt angeblich eine aktuelle Demonstration. Was ist die beste Prüfung?",options:["Die Kommentare lesen und der Mehrheit vertrauen","Einzelbilder rückwärts suchen und Datum, Ort sowie Originalquelle vergleichen","Das Video weiterleiten und nachfragen","Auf die hohe Auflösung achten"],answer:1,explain:"Alte Aufnahmen werden oft mit neuer Behauptung verbreitet. Eine Rückwärtssuche und Kontextprüfung helfen, die Herkunft einzuordnen."},
{q:"Ein KI-Detektor meldet 98 % Wahrscheinlichkeit für ein KI-Bild. Was folgt daraus?",options:["Das Bild ist definitiv KI-generiert","Das Bild ist definitiv echt","Das Ergebnis ist ein Hinweis, aber kein sicherer Herkunftsnachweis","Die Prozentzahl beweist, dass das Bild bearbeitet wurde"],answer:2,explain:"KI-Detektoren können falsch liegen. Ein belastbarer Nachweis braucht nachvollziehbare Herkunft und zusätzliche Belege."},
{q:"Wie überprüfst du eine verdächtige Nachricht?",options:["Sofort weiterleiten","Nur die Überschrift lesen","Mehrere seriöse Quellen und Originalbelege prüfen","Viele Likes als Beweis ansehen"],answer:2,explain:"Vergleiche Quellen, Datum, Autor und Belege. Hohe Reichweite beweist nichts."},
{q:"Welches Beispielpasswort ist am sichersten?",options:["12345678","Passwort2026","THS12345","Wolke!Fahrrad7Mond#See"],answer:3,explain:"Lange, einzigartige Passphrasen sind stärker. Nutze für jedes Konto ein anderes Passwort und möglichst MFA."},
{q:"Warum zeigen soziale Netzwerke bestimmte Beiträge häufiger?",options:["Weil alle dieselben Beiträge sehen","Weil Algorithmen dein Verhalten und andere Signale auswerten","Weil nur echte Nachrichten empfohlen werden","Weil die Reihenfolge zufällig ist"],answer:1,explain:"Empfehlungssysteme berücksichtigen etwa Interaktionen, Wiedergabedauer und Interessen."},
{q:"Welche Informationen solltest du nicht öffentlich teilen?",options:["Dein Lieblingsessen","Allgemeine Hobbys","Passwörter, private Adresse und Ausweisdaten","Dein Lieblingsfilm"],answer:2,explain:"Schütze Zugangsdaten und persönliche Identifikationsdaten. Teile nur, was wirklich nötig ist."}
];
const quizQuestions=questions.slice(0,6);
const app=document.getElementById("app");
let index=-1,score=0,answers=[],locked=false,submitted=false;
function begin(){index=0;score=0;answers=[];locked=false;submitted=false;draw()}
function draw(){
 if(index<0){app.innerHTML='<section class="card"><span class="tag">TAG DER OFFENEN TÜR</span><h1>Echt oder <span style="color:#86b6ff">KI?</span></h1><p>3 Bildfragen und 3 Wissensfragen · etwa 3 Minuten.</p><button class="btn primary" id="start">QUIZ STARTEN →</button></section>';return}
 if(index>=quizQuestions.length){
  app.innerHTML='<section class="card"><span class="tag">GESCHAFFT!</span><div class="score">'+score+' / 6</div><h2>Dein Ergebnis</h2><p>'+Math.round(score/6*100)+' % richtig beantwortet.</p><p id="save">Anonyme Statistik wird gespeichert …</p><button class="btn primary" id="again">ERNEUT SPIELEN</button><a href="./auswertung.html?quiz=bilder">Zur Quiz-Auswertung</a><br><a href="./webseiten-check.html">Zum Webseiten-Check</a><br><a href="./social-media-umfrage.html">Zur Social-Media-Umfrage</a></section>';
  if(!submitted){submitted=true;if(window.THSStats){window.THSStats.submit("bilder",answers).then(ok=>{const e=document.getElementById("save");if(e)e.textContent=ok?"Anonym gespeichert ✓":"Ergebnis angezeigt; Speicherung derzeit nicht verfügbar."}).catch(()=>{const e=document.getElementById("save");if(e)e.textContent="Ergebnis angezeigt; Speicherung derzeit nicht verfügbar."})}else document.getElementById("save").textContent="Statistik nicht erreichbar."}return
 }
 locked=false;const q=quizQuestions[index];const opts=q.t==="image"?["ECHTES FOTO","KI-GENERIERT"]:q.options;
 const image=q.t==="image"?'<div class="image-wrap" id="image-wrap"><img class="image" src="'+q.image+'" alt="Bild für Frage '+(index+1)+'">'+(index===2?'<span class="marker" style="left:90%;top:80%">1</span><span class="marker" style="left:70%;top:62%">2</span><span class="marker" style="left:43%;top:36%">3</span>':'')+'</div><a class="image-link" href="'+q.image+'" target="_blank" rel="noopener">Bild groß öffnen ↗</a>':'';
 app.innerHTML='<section class="card"><span class="tag">FRAGE '+(index+1)+' / 6</span><div class="progress"><div style="width:'+(index/6*100)+'%"></div></div><h2>'+q.q+'</h2>'+image+'<div id="answers">'+opts.map((v,i)=>'<button class="btn" data-answer="'+i+'">'+v+'</button>').join("")+'</div><div id="feedback" class="feedback hide"></div><button class="btn primary hide" id="next">'+(index===5?"ERGEBNIS ANZEIGEN":"WEITER →")+'</button></section>';
}
function choose(a){if(locked||index<0||index>=6)return;locked=true;const q=quizQuestions[index];const correct=a===q.answer;if(correct)score++;answers.push({question_id:index+1,correct});document.querySelectorAll("[data-answer]").forEach(el=>{const n=Number(el.dataset.answer);el.disabled=true;if(n===q.answer)el.classList.add("correct");else if(n===a)el.classList.add("wrong")});const feedback=document.getElementById("feedback");feedback.classList.remove("hide");feedback.textContent=(correct?"✓ Richtig! ":"✕ Nicht ganz. ")+q.explain;showImageExplanation(q,feedback);document.getElementById("next").classList.remove("hide")}
function showImageExplanation(q,feedback){
if(q.t!=="image")return;
const list=document.createElement("ol");
const details=index===2?[
"Unten rechts, neben dem Tellerrand (1): Die dunkle, metallisch glänzende Form lässt sich nicht eindeutig als Besteck oder Griff verfolgen. Prüft, ob ihre Teile räumlich sinnvoll zusammenpassen. Die starke Verschattung macht die Stelle zusätzlich schwer lesbar.",
"Vorne rechts, an der aufrechten Tomatenscheibe (2): Dunkle, kringelige Flecken und die ungewöhnlich glatte Oberfläche fallen auf. Prüft die Struktur von Schale, Fruchtfleisch und Kernen. Gewürze oder Grillspuren wären ebenfalls mögliche Erklärungen.",
"Oben in der Mitte, auf den Fleischstücken (3): Kräuter und weiße Garnitur gehen an manchen Stellen schwer unterscheidbar ineinander über. Achtet auf klare Ränder und nachvollziehbare Strukturen. Auch echte Soße und geringe Schärfentiefe können ähnlich wirken.",
"Der verlässliche Beleg ist die Herkunft: Der Urheber Dennis Sylvester Hurd beschreibt dieses Motiv ausdrücklich als mit Midjourney generiert. Perfektes Licht, kräftige Farben oder ein appetitlicher Teller allein sind kein KI-Beweis."
]:index===0?[
"Prüft am Ufer und an den Bergkanten, ob Formen durchgehend und räumlich nachvollziehbar sind. Bei Wasser können Wind und Blickwinkel eine Spiegelung verändern.",
"Eine schöne oder sehr gleichmäßige Landschaft ist kein KI-Beweis. Auch Fotos werden bearbeitet. Für dieses Quiz ist die dokumentierte Fotoquelle ausschlaggebend."
]:[
"Prüft die Übergänge zwischen Ohren, Kopf, Fell und Körper: Sind Konturen und Körperteile nachvollziehbar? Verdeckte Pfoten sind nicht automatisch fehlende Pfoten.",
"Fell, Schärfe und Licht können auch bei echten Fotos ungewöhnlich aussehen. Die dokumentierte Herkunft bestätigt hier die Fotografie; das Aussehen allein liefert keine Sicherheit."
];
details.forEach(text=>{const li=document.createElement("li");li.textContent=text;list.append(li)});feedback.append(list);
if(index===2)document.getElementById("image-wrap").classList.add("revealed");
const source=document.createElement("a");source.href=index===0?"https://commons.wikimedia.org/wiki/File:Mountain_lake_in_Alps.jpg":index===1?"https://commons.wikimedia.org/wiki/File:Wild_Red_Fox.jpg":"https://commons.wikimedia.org/wiki/File:Generative_AI_can_be_used_to_create_realistic_images_of_food_dishes.jpg";source.target="_blank";source.rel="noopener";source.textContent="Bildquelle und Herkunft prüfen ↗";feedback.append(source);
}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.id==="start"||b.id==="again")begin();else if(b.hasAttribute("data-answer"))choose(Number(b.dataset.answer));else if(b.id==="next"&&locked){index++;draw()}});
</script></body></html>
