<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080e20"><title>THS · Live-Auswertung</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080e20;color:#f3f7ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.dashboard{max-width:2400px;margin:auto;padding:20px 26px;min-height:100dvh;display:flex;flex-direction:column;gap:15px}header{display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{color:#6de2d1;font-size:12px;font-weight:850;letter-spacing:2px}h1{font-size:clamp(24px,2.6vw,50px);line-height:1.1;margin:6px 0}h1 span{color:#96a8ff}.subtitle{margin:5px 0 0;color:#b4c2dc;font-size:13px}.total{display:flex;align-items:center;gap:16px;background:#14243e;border:1px solid #34506c;border-radius:18px;padding:9px 24px;flex-shrink:0}.total strong{font-size:clamp(38px,4vw,72px);line-height:1;color:#75edda;font-variant-numeric:tabular-nums}.total span{font-size:14px;font-weight:750;max-width:105px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;flex:1}.card{background:linear-gradient(140deg,#14243d,#101a30);border:1px solid #2e4263;border-radius:18px;padding:16px 19px;min-width:0;display:flex;flex-direction:column}.card h2{font-size:clamp(17px,1.35vw,26px);margin:0 0 3px;line-height:1.2}.hint{font-size:11px;line-height:1.3;color:#afbdd5;min-height:27px;margin:0 0 7px}.rows{display:flex;flex-direction:column;justify-content:space-evenly;gap:8px;flex:1}.row{min-width:0}.row-head{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-bottom:4px}.label{font-size:clamp(12px,1.03vw,20px);line-height:1.16;overflow-wrap:anywhere}.value{white-space:nowrap;font-size:clamp(14px,1.2vw,24px);font-variant-numeric:tabular-nums;font-weight:850}.value small{font-size:.72em;color:#bbc8e0;font-weight:600}.track{height:clamp(7px,1vh,13px);border-radius:20px;background:#263751;overflow:hidden}.fill{height:100%;border-radius:20px;background:linear-gradient(90deg,#52dfcf,#7b91ff);transition:width .5s}.card:nth-child(2n) .fill{background:linear-gradient(90deg,#8892ff,#bd90fc)}footer{display:flex;align-items:center;justify-content:space-between;gap:12px;color:#bdcae0;font-size:12px}.status{display:flex;gap:8px;align-items:center}.dot{height:8px;width:8px;background:#74e7c6;border-radius:50%;flex-shrink:0}.error .dot{background:#ffba72}.actions{display:flex;gap:8px;align-items:center}button,a{font:inherit;color:#e5edff;background:#182b47;border:1px solid #3c5577;border-radius:8px;padding:7px 11px;text-decoration:none;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #75edda}button:disabled{opacity:.6}.empty{color:#aebfd9} 
@media(min-width:1000px) and (min-height:600px){.dashboard{height:100dvh;min-height:0}.grid{min-height:0;grid-template-rows:repeat(2,minmax(0,1fr))}.card{min-height:0}}
@media(min-width:1600px){.dashboard{padding:25px 34px;gap:20px}.grid{gap:20px}.card{padding:22px 26px}.hint{font-size:14px}.brand,footer,.subtitle{font-size:15px}}
@media(max-width:999px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card{min-height:260px}.dashboard{padding:16px;gap:12px}.total{padding:12px}.total span{font-size:12px}footer{flex-wrap:wrap}}
@media(max-width:560px){header{align-items:flex-start;gap:10px}.grid{grid-template-columns:1fr}.total{flex-direction:column;gap:3px;text-align:center}.total strong{font-size:35px}.total span{font-size:10px}.brand{font-size:10px}.subtitle{font-size:12px}h1{font-size:25px}.card{min-height:280px}.label{font-size:15px}.value{font-size:20px}.hint{font-size:12px}}
@media(min-width:1000px) and (max-height:800px){.dashboard{padding:12px 18px;gap:10px}.grid{gap:10px}.card{padding:10px 14px}.card h2{font-size:17px}.hint{font-size:10px;min-height:18px;margin-bottom:4px}.rows{gap:4px}.label{font-size:12px}.value{font-size:15px}.track{height:6px}.total strong{font-size:42px}h1{font-size:28px}.subtitle{font-size:12px}}
@media(min-width:700px) and (max-width:999px) and (min-height:850px){.dashboard{height:100dvh;min-height:0}.grid{min-height:0;grid-template-rows:repeat(3,minmax(0,1fr))}.card{min-height:0;padding:10px 14px}.hint{min-height:18px;margin-bottom:4px}.rows{gap:4px}.track{height:6px}.card h2{font-size:17px}}
</style></head>
<body><main class="dashboard"><header><div><div class="brand">THS · MEDIENBILDUNG · LIVE</div><h1>Social Media <span>in Zahlen.</span></h1><p class="subtitle">So nutzt unser Publikum Social Media · Anzahl & Anteil der Teilnehmenden</p></div><div class="total"><strong id="count">–</strong><span>Teilnahmen insgesamt</span></div></header>
<div class="grid" id="charts" aria-label="Ergebnisse aller sechs Fragen"></div>
<footer><div class="status" id="status" role="status"><span class="dot"></span><span id="statusText">Ergebnisse werden geladen …</span></div><div class="actions"><a href="./social-media-umfrage.html">Mitmachen ↗</a><button id="reload">↻ Aktualisieren</button><button id="fullscreen">⛶ Vollbild</button></div></footer></main>
<script src="./stats.js"></script><script>
const groups=[
{key:"Alter",title:"01 · Alter",hint:"Altersgruppen in Jahren",options:["10–14","15–17","18–24","25–39","40–59","60+"]},
{key:"Geschlecht",title:"02 · Geschlecht",hint:"Selbstauskunft der Teilnehmenden",options:["Männlich","Weiblich","Divers","Keine Angabe"]},
{key:"Bildschirmzeit",title:"03 · Tägliche Social-Media-Zeit",hint:"Wie lange werden Social-Media-Apps genutzt?",options:["Unter 1 Stunde","1–2 Stunden","2–3 Stunden","3–4 Stunden","Mehr als 4 Stunden"]},
{key:"Lieblings-App",title:"04 · Meistgenutzte App",hint:"Welche App wird am häufigsten genutzt?",options:["Instagram","TikTok","Snapchat","YouTube","WhatsApp","Andere"]},
{key:"Hauptnutzung",title:"05 · Gründe für die Nutzung",hint:"Mehrfachauswahl · Summe kann über 100 % liegen",options:["Unterhaltung und Zeitvertreib","Kommunikation mit Freunden und Familie","Nachrichten und Informationen","Lernen und Bildung","Inspiration und Kreativität"],labels:["Unterhaltung & Zeitvertreib","Freunde & Familie","Nachrichten & Informationen","Lernen & Bildung","Inspiration & Kreativität"]},
{key:"Konzentration",title:"06 · Einfluss auf Konzentration",hint:"Wie stark beeinflusst Social Media den Alltag?",options:["Gar nicht","Wenig","Mittelmäßig","Stark","Sehr stark"]}
];
function ageGroup(n){return n<15?"10–14":n<18?"15–17":n<25?"18–24":n<40?"25–39":n<60?"40–59":"60+"}
function aggregate(rows,g){const counts=Object.fromEntries(g.options.map(x=>[x,0]));rows.filter(x=>x.question===g.key).forEach(x=>{const k=g.key==="Alter"?ageGroup(Number(x.answer)):x.answer;if(k in counts)counts[k]+=Number(x.responses)||0});return counts}
function render(rows,total,loaded){const root=document.getElementById("charts");root.replaceChildren();groups.forEach(g=>{const card=document.createElement("section");card.className="card";const title=document.createElement("h2");title.textContent=g.title;const hint=document.createElement("p");hint.className="hint";hint.textContent=g.hint;const list=document.createElement("div");list.className="rows";const counts=aggregate(rows,g);g.options.forEach((answer,i)=>{const n=counts[answer],pct=total?Math.round(n/total*100):0;const row=document.createElement("div");row.className="row";const head=document.createElement("div");head.className="row-head";const label=document.createElement("span");label.className="label";label.textContent=g.labels?.[i]||answer;const value=document.createElement("span");value.className="value";value.textContent=loaded?n+" ":"– ";const percent=document.createElement("small");percent.textContent=loaded?"· "+pct+" %":"";value.append(percent);head.append(label,value);const track=document.createElement("div");track.className="track";const fill=document.createElement("div");fill.className="fill";fill.style.width=Math.min(100,pct)+"%";track.append(fill);row.append(head,track);list.append(row)});card.append(title,hint,list);root.append(card)})}
let busy=false,lastUpdated=null;
async function load(){if(busy)return;busy=true;const button=document.getElementById("reload");button.disabled=true;const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),12000);try{const c=window.THS_CONFIG;if(!c?.url||!c?.anonKey)throw Error("Keine Verbindung");const r=await fetch(c.url.replace(/\/$/,"")+"/rest/v1/rpc/social_media_survey_summary",{method:"POST",headers:{apikey:c.anonKey,"Content-Type":"application/json"},body:"{}",signal:controller.signal});if(!r.ok)throw Error("Datenabruf fehlgeschlagen");const rows=await r.json();if(!Array.isArray(rows))throw Error("Ungültige Antwort");const total=rows.filter(x=>x.question==="Geschlecht").reduce((n,x)=>n+Number(x.responses),0);document.getElementById("count").textContent=total;render(rows,total,true);lastUpdated=new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit",second:"2-digit"});document.getElementById("status").classList.remove("error");document.getElementById("statusText").textContent=(total?"Live · Stand "+lastUpdated:"Noch keine Teilnahmen")+" · Automatisch alle 15 Sekunden"}catch(e){document.getElementById("status").classList.add("error");document.getElementById("statusText").textContent="Verbindung unterbrochen · Neuer Versuch automatisch"+(lastUpdated?" · Letzter Stand "+lastUpdated:"")}finally{clearTimeout(timer);busy=false;button.disabled=false}}
document.getElementById("reload").addEventListener("click",load);
document.getElementById("fullscreen").addEventListener("click",async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else throw Error()}catch{document.getElementById("statusText").textContent="Vollbild am Computer mit F11 einschalten."}});
document.addEventListener("fullscreenchange",()=>{document.getElementById("fullscreen").textContent=document.fullscreenElement?"⛶ Vollbild beenden":"⛶ Vollbild"});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
render([],0,false);load();setInterval(()=>{if(!document.hidden)load()},15000);
</script></body></html>
