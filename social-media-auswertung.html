<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THS · Social-Media-Auswertung</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 90% 0%,#233a73 0,transparent 42%),#0a1226;color:#f3f7ff;font:16px system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:850px;margin:auto;padding:25px 17px 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:13px;font-weight:850;letter-spacing:1.3px;color:#77e8d7}.pill{border:1px solid #48648d;border-radius:40px;padding:7px 12px;color:#c8d9f3;font-size:12px}.hero{padding:45px 0 22px}h1{font-size:clamp(34px,7vw,57px);letter-spacing:-1.5px;line-height:1.09;margin:14px 0}h1 span{color:#8a9cff}h2{font-size:24px}.lead{font-size:17px;color:#bfcee5;line-height:1.6;max-width:700px}.card{border:1px solid #334c70;background:#14233d;border-radius:22px;padding:clamp(19px,4vw,30px);margin:16px 0}.qtitle{font-weight:750;font-size:18px;margin-bottom:16px}.qnum{color:#6be1d2;font-size:13px;margin-right:8px}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.option{position:relative;cursor:pointer}.option input{position:absolute;opacity:0;width:1px;height:1px}.option span{display:flex;align-items:center;min-height:55px;padding:13px 15px;background:#1d3152;border:1px solid #456184;border-radius:13px;color:#e4eeff;transition:.15s}.option input:checked+span{background:#294c82;border-color:#77caff;box-shadow:0 0 0 2px #77caff44}.option input:focus-visible+span{outline:3px solid #79e2d3}.age{width:100%;max-width:240px;background:#1d3152;color:white;border:1px solid #5a7599;border-radius:13px;padding:16px;font:inherit}.button{background:linear-gradient(120deg,#447ff5,#7258e7);color:white;border:0;border-radius:15px;padding:19px 28px;font:800 17px system-ui;cursor:pointer;width:100%}.button:disabled{opacity:.65;cursor:wait}.muted{color:#b8cbe5}.error{color:#ff9caa}.success{color:#85f1c9}.hide{display:none!important}footer{font-size:12px;color:#96abc9;text-align:center;margin-top:28px}a{color:#9bc8ff}@media(max-width:550px){.options{grid-template-columns:1fr}.hero{padding-top:30px}}.bars{margin-top:18px}.line{margin:15px 0 22px}.linehead{display:flex;justify-content:space-between;gap:10px;color:#dce8fc;font-size:14px}.track{height:15px;background:#253d60;border-radius:20px;overflow:hidden;margin-top:8px}.fill{height:100%;background:linear-gradient(90deg,#5de3d3,#777df7);border-radius:20px}.stat{font-size:40px;font-weight:900;color:#7de8d7}.section{margin-top:20px}</style></head><body><div class="wrap"><header class="top"><div class="brand">THS · MEDIENBILDUNG</div><div class="pill">LIVE-STATISTIK</div></header><div class="hero"><h1>Social Media <span>in Zahlen.</span></h1><p class="lead">Anonyme, zusammengefasste Antworten zur Bildschirmzeit, Nutzung und Konzentration.</p></div><section class="card"><div class="brand">TEILNAHMEN</div><div id="count" class="stat">–</div><button class="button" id="reload" style="max-width:230px;margin-top:12px">↻ Aktualisieren</button><p id="status" class="muted" role="status">Lade Ergebnisse …</p></section><div id="charts"></div><footer><a href="./social-media-umfrage.html">Zur Umfrage</a> · Nur zusammengefasste Ergebnisse</footer></div><script src="./stats.js"></script><script>
const questions=[["Alter","Alter in Jahren"],["Geschlecht","Geschlecht"],["Bildschirmzeit","Tägliche Social-Media-Zeit"],["Lieblings-App","Meistgenutzte App"],["Hauptnutzung","Wofür wird Social Media genutzt?"],["Konzentration","Einfluss auf die Konzentration"]];
const orders={"Geschlecht":["Männlich","Weiblich","Divers","Keine Angabe"],"Bildschirmzeit":["Unter 1 Stunde","1–2 Stunden","2–3 Stunden","3–4 Stunden","Mehr als 4 Stunden"],"Lieblings-App":["Instagram","TikTok","Snapchat","YouTube","WhatsApp","Andere"],"Hauptnutzung":["Unterhaltung und Zeitvertreib","Kommunikation mit Freunden und Familie","Nachrichten und Informationen","Lernen und Bildung","Inspiration und Kreativität"],"Konzentration":["Gar nicht","Wenig","Mittelmäßig","Stark","Sehr stark"]};
function esc(x){return String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function load(){const st=document.getElementById("status");st.textContent="Lade Ergebnisse …";try{const c=window.THS_CONFIG;if(!c?.url||!c?.anonKey)throw Error("Datenbank nicht verbunden");const r=await fetch(c.url.replace(/\/$/,"")+"/rest/v1/rpc/social_media_survey_summary",{method:"POST",headers:{"apikey":c.anonKey,"Content-Type":"application/json"},body:"{}"});if(!r.ok)throw Error("Datenabruf fehlgeschlagen ("+r.status+")");const rows=await r.json();const total=rows.filter(x=>x.question==="Geschlecht").reduce((n,x)=>n+Number(x.responses),0);document.getElementById("count").textContent=total;const out=document.getElementById("charts");out.innerHTML="";for(const [key,title] of questions){const data=rows.filter(x=>x.question===key);data.sort((a,b)=>key==="Alter"?Number(a.answer)-Number(b.answer):(orders[key]||[]).indexOf(a.answer)-(orders[key]||[]).indexOf(b.answer));const section=document.createElement("section");section.className="card section";section.innerHTML="<h2>"+esc(title)+"</h2>"+(data.length?data.map(x=>{const pct=total?Math.round(Number(x.responses)/total*100):0;return '<div class="line"><div class="linehead"><span>'+esc(x.answer)+'</span><strong>'+x.responses+' · '+pct+' %</strong></div><div class="track"><div class="fill" style="width:'+pct+'%"></div></div></div>'}).join(""):'<p class="muted">Noch keine Antworten</p>');out.appendChild(section)}st.textContent=total?"Aktualisiert · Alle Angaben in Prozent der Teilnahmen.":"Noch keine Teilnahmen vorhanden."}catch(e){st.textContent="Fehler: "+e.message}}
document.getElementById("reload").addEventListener("click",load);load();
</script></body></html>
